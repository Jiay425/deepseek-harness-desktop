name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        shell: pwsh
        run: ./build.ps1

      - name: Zip package
        shell: pwsh
        run: |
          $pkg = Join-Path $env:USERPROFILE "dsh-build\DeepSeek Harness Desktop"
          Compress-Archive -Path (Join-Path $pkg "*") -DestinationPath "DeepSeek-Harness-Desktop-win32-x64.zip" -Force

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "DeepSeek-Harness-Desktop-win32-x64.zip" `
            --title "DeepSeek Harness Desktop ${{ github.ref_name }}" `
            --notes "Windows x64 桌面客户端。解压后运行 install.ps1 安装（或直接运行 DeepSeek Harness Desktop.exe）。"
